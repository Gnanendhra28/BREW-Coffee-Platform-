name: Deploy to Google Cloud Run (GCP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy-to-gcp:
    name: 🚀 Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy brew-coffee-platform \
            --source . \
            --project ${{ vars.GCP_PROJECT_ID || 'hiring-ai-507307' }} \
            --region ${{ vars.GCP_REGION || 'asia-south1' }} \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --memory 2Gi \
            --cpu 2 \
            --set-env-vars NODE_ENV=production,NEXT_PUBLIC_SITE_URL=https://brew-coffee.cafe
