[project]
name = "brew-fastapi-backend"
version = "0.1.0"
description = "BREW Coffee Platform — High-Performance Python FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.16.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
